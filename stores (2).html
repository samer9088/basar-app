<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دليل المتاجر — بصر</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    background: #f6f5fb;
    margin: 0;
    padding: 20px 16px 40px;
  }
  .header { max-width: 480px; margin: 0 auto 20px; text-align: center; }
  .brand { font-weight: 700; font-size: 15px; color: #3C3489; margin-bottom: 4px; }
  .title { font-size: 20px; font-weight: 700; color: #1a1a1a; margin: 0 0 4px; }
  .subtitle { font-size: 13px; color: #777; margin: 0; }

  .city-filter {
    max-width: 480px; margin: 16px auto;
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
  }
  .city-chip {
    padding: 6px 16px; border-radius: 20px; border: 1px solid #e5e2f5;
    background: #fff; color: #534AB7; font-size: 13px; font-weight: 500;
    cursor: pointer;
  }
  .city-chip.active { background: #534AB7; color: #fff; border-color: #534AB7; }

  .list { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

  .card {
    background: #fff; border: 1px solid #e5e2f5; border-radius: 16px;
    padding: 16px; display: flex; align-items: center; gap: 12px;
  }
  .logo {
    width: 48px; height: 48px; border-radius: 12px; background: #EEEDFE;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; color: #534AB7; flex-shrink: 0;
  }
  .info { flex: 1; min-width: 0; }
  .name { font-size: 15px; font-weight: 700; margin: 0 0 2px; color: #1a1a1a; }
  .city { font-size: 12px; color: #999; margin: 0 0 2px; }
  .desc { font-size: 12px; color: #666; margin: 4px 0 0; line-height: 1.5; }
  .tier-badge {
    display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 8px;
    border-radius: 10px; background: #FAEEDA; color: #854F0B; margin-top: 4px;
  }
  .wa-btn {
    flex-shrink: 0; width: 40px; height: 40px; border-radius: 10px;
    background: #25d366; display: flex; align-items: center; justify-content: center;
    text-decoration: none;
  }

  .state { text-align: center; color: #777; padding: 40px 0; font-size: 14px; max-width: 480px; margin: 0 auto; }
</style>
</head>
<body>
  <div class="header">
    <div class="brand">بصر</div>
    <p class="title">دليل المتاجر</p>
    <p class="subtitle">محلات النظارات والعدسات القريبة منك</p>
  </div>

  <div class="city-filter" id="cityFilter"></div>
  <div class="list" id="list">
    <div class="state">جارِ التحميل...</div>
  </div>

  <script>
    const SUPABASE_URL = "https://itblplmyuuvimdifldew.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml0YmxwbG15dXV2aW1kaWZsZGV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxMDczMTksImV4cCI6MjA4ODY4MzMxOX0.UN7FQtZ9KPGWLgsQTk4yWbvWVvEQQkk-UI2vtwP_LBw";

    let allMerchants = [];
    let activeCity = "الكل";

    const tierLabels = { trial: "تجريبي", basic: "أساسي", featured: "مميز", professional: "احترافي" };

    function waLink(number) {
      const clean = number.replace(/[^\d]/g, "");
      return `https://wa.me/${clean}`;
    }

    function render() {
      const list = document.getElementById("list");
      const filtered = activeCity === "الكل"
        ? allMerchants
        : allMerchants.filter(m => m.city === activeCity);

      if (!filtered.length) {
        list.innerHTML = '<div class="state">لا توجد متاجر في هذه المدينة حالياً</div>';
        return;
      }

      list.innerHTML = filtered.map(m => `
        <div class="card">
          <a class="card-main" href="store.html?id=${m.id}" style="display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-decoration:none;color:inherit">
            <div class="logo">${(m.name || "?").charAt(0)}</div>
            <div class="info">
              <p class="name">${m.name}</p>
              <p class="city">📍 ${m.city}</p>
              ${m.description ? `<p class="desc">${m.description}</p>` : ""}
              <span class="tier-badge">${tierLabels[m.tier] || m.tier}</span>
            </div>
          </a>
          <a class="wa-btn" href="${waLink(m.whatsapp)}" target="_blank" aria-label="تواصل عبر واتساب">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
          </a>
        </div>
      `).join("");
    }

    function renderCityFilter() {
      const cities = ["الكل", ...new Set(allMerchants.map(m => m.city))];
      const el = document.getElementById("cityFilter");
      el.innerHTML = cities.map(c =>
        `<button class="city-chip ${c === activeCity ? "active" : ""}" data-city="${c}">${c}</button>`
      ).join("");
      el.querySelectorAll(".city-chip").forEach(btn => {
        btn.addEventListener("click", () => {
          activeCity = btn.dataset.city;
          renderCityFilter();
          render();
        });
      });
    }

    async function load() {
      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/merchants?status=eq.active&select=id,name,city,whatsapp,description,tier&order=tier.desc,name.asc`,
          {
            headers: {
              apikey: SUPABASE_ANON_KEY,
              Authorization: `Bearer ${SUPABASE_ANON_KEY}`
            }
          }
        );
        allMerchants = await res.json();
        renderCityFilter();
        render();
      } catch (e) {
        document.getElementById("list").innerHTML = '<div class="state">تعذر تحميل المتاجر</div>';
      }
    }

    load();
  </script>
</body>
</html>
