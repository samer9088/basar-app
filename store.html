<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المتجر — بصر</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    background: #f6f5fb;
    margin: 0;
    padding: 0 0 40px;
  }
  .banner {
    height: 100px;
    background: linear-gradient(135deg, #534AB7, #7F77DD);
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 0 16px; }

  .header-card {
    background: #fff; border: 1px solid #e5e2f5; border-radius: 16px;
    padding: 16px; margin-top: -40px; position: relative;
    display: flex; align-items: center; gap: 14px;
  }
  .logo {
    width: 64px; height: 64px; border-radius: 16px; background: #EEEDFE;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 700; color: #534AB7; flex-shrink: 0;
    border: 3px solid #fff; overflow: hidden;
  }
  .logo img { width: 100%; height: 100%; object-fit: cover; }
  .name { font-size: 18px; font-weight: 700; margin: 0 0 2px; color: #1a1a1a; }
  .city { font-size: 13px; color: #999; margin: 0 0 4px; }
  .tier-badge {
    display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 8px;
    border-radius: 10px; background: #FAEEDA; color: #854F0B;
  }

  .wa-cta {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: #25d366; color: #fff; text-decoration: none;
    border-radius: 14px; padding: 14px; margin-top: 16px;
    font-size: 15px; font-weight: 700;
  }

  .section { margin-top: 24px; }
  .section-title { font-size: 14px; font-weight: 700; color: #444; margin: 0 0 10px; }
  .desc { font-size: 14px; color: #444; line-height: 1.8; margin: 0; white-space: pre-line; }

  .photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .photos img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; }

  .offer {
    background: #fff; border: 1px solid #e5e2f5; border-radius: 12px;
    padding: 12px 14px; margin-bottom: 8px;
  }
  .offer-title { font-size: 14px; font-weight: 700; color: #3C3489; margin: 0 0 2px; }
  .offer-detail { font-size: 13px; color: #666; margin: 0; line-height: 1.6; }

  .state { text-align: center; color: #777; padding: 60px 16px; font-size: 14px; }
  .back-link {
    display: inline-block; margin-top: 16px; font-size: 13px; color: #534AB7;
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="banner"></div>
  <div class="wrap" id="content">
    <div class="state">جارِ التحميل...</div>
  </div>

  <script>
    const SUPABASE_URL = "https://itblplmyuuvimdifldew.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml0YmxwbG15dXV2aW1kaWZsZGV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxMDczMTksImV4cCI6MjA4ODY4MzMxOX0.UN7FQtZ9KPGWLgsQTk4yWbvWVvEQQkk-UI2vtwP_LBw";

    const tierLabels = { trial: "تجريبي", basic: "أساسي", featured: "مميز", professional: "احترافي" };

    function waLink(number) {
      const clean = (number || "").replace(/[^\d]/g, "");
      return `https://wa.me/${clean}`;
    }

    function render(m) {
      const content = document.getElementById("content");
      if (!m) {
        content.innerHTML = '<div class="state">المتجر غير موجود</div>';
        return;
      }

      const photos = Array.isArray(m.photos) ? m.photos : [];
      const offers = Array.isArray(m.offers) ? m.offers : [];
      const description = m.full_description || m.description || "";

      content.innerHTML = `
        <div class="header-card">
          <div class="logo">${m.logo_url ? `<img src="${m.logo_url}" alt="${m.name}">` : (m.name || "?").charAt(0)}</div>
          <div>
            <p class="name">${m.name}</p>
            <p class="city">📍 ${m.city}</p>
            <span class="tier-badge">${tierLabels[m.tier] || m.tier}</span>
          </div>
        </div>

        <a class="wa-cta" href="${waLink(m.whatsapp)}" target="_blank">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
          تواصل عبر واتساب
        </a>

        ${description ? `
          <div class="section">
            <p class="section-title">عن المتجر</p>
            <p class="desc">${description}</p>
          </div>
        ` : ""}

        ${offers.length ? `
          <div class="section">
            <p class="section-title">العروض الحالية</p>
            ${offers.map(o => `
              <div class="offer">
                <p class="offer-title">${o.title || ""}</p>
                ${o.detail ? `<p class="offer-detail">${o.detail}</p>` : ""}
              </div>
            `).join("")}
          </div>
        ` : ""}

        ${photos.length ? `
          <div class="section">
            <p class="section-title">صور من المتجر</p>
            <div class="photos">
              ${photos.map(p => `<img src="${p}" alt="${m.name}">`).join("")}
            </div>
          </div>
        ` : ""}

        <a class="back-link" href="stores.html">‹ رجوع لدليل المتاجر</a>
      `;
    }

    async function load() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      if (!id) {
        document.getElementById("content").innerHTML = '<div class="state">رابط غير صالح</div>';
        return;
      }
      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/merchants?id=eq.${encodeURIComponent(id)}&status=eq.active&select=*`,
          {
            headers: {
              apikey: SUPABASE_ANON_KEY,
              Authorization: `Bearer ${SUPABASE_ANON_KEY}`
            }
          }
        );
        const rows = await res.json();
        render(rows && rows[0]);
      } catch (e) {
        document.getElementById("content").innerHTML = '<div class="state">تعذر تحميل بيانات المتجر</div>';
      }
    }

    load();
  </script>
</body>
</html>
